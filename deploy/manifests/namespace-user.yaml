# Template for a user Kubernetes namespace.
# Replace {{USER_SLUG}} with the sanitized user namespace slug (e.g. ss-user-alice).
apiVersion: v1
kind: Namespace
metadata:
  name: {{USER_K8S_NAMESPACE}}
  labels:
    slipstream.io/type: user
    slipstream.io/namespace-slug: {{NAMESPACE_SLUG}}
    kubernetes.io/metadata.name: {{USER_K8S_NAMESPACE}}
