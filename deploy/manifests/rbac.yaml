---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-web
  namespace: slipstream-system

---
# ClusterRole for managing project resources across all user/org namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-web
rules:
  # Pod management
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # PVC management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]

  # Service management (for agent services)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]

  # NetworkPolicy management
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]

  # Gateway API HTTPRoute management
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "get", "list", "delete"]

  # Namespace read-only (for listing user/org namespaces)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-web
subjects:
  - kind: ServiceAccount
    name: slipstream-web
    namespace: slipstream-system
