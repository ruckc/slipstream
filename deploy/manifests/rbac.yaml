---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-web
  namespace: slipstream-system

---
# ClusterRole for managing project resources across all user/org namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-web
rules:
  # Pod read (for IP lookup — Deployment manages pod lifecycle)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Deployment management (scale-to-zero / scale-to-one for project containers)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # PVC management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]

  # Service management (for agent services)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]

  # NetworkPolicy management
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]

  # Gateway API HTTPRoute management
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "get", "list", "delete"]

  # Namespace management (create user/org namespaces at registration time)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-web
subjects:
  - kind: ServiceAccount
    name: slipstream-web
    namespace: slipstream-system
