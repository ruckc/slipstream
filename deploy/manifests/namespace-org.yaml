# Template for an organization Kubernetes namespace.
# Replace {{ORG_K8S_NAMESPACE}} with the sanitized org namespace slug (e.g. ss-org-my-org).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ORG_K8S_NAMESPACE}}
  labels:
    slipstream.io/type: org
    slipstream.io/namespace-slug: {{NAMESPACE_SLUG}}
    kubernetes.io/metadata.name: {{ORG_K8S_NAMESPACE}}
