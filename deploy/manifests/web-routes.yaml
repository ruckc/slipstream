# Routes for the slipstream-web service on slips.ruck.io.
#
# Assumes the Gateway has:
#   - a listener named "http"  (protocol: HTTP,  port: 80)
#   - a listener named "https" (protocol: HTTPS, port: 443, with a TLS certificateRef)
#   - a listener named "tcp"   (protocol: TCP,   port: 443) — only if TLS passthrough is needed
---
# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slipstream-web-redirect
  namespace: slipstream-system
spec:
  parentRefs:
    - name: slipstream-gateway
      namespace: slipstream-system
      sectionName: http
  hostnames:
    - slips.ruck.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# HTTPS traffic to the web service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slipstream-web
  namespace: slipstream-system
spec:
  parentRefs:
    - name: slipstream-gateway
      namespace: slipstream-system
      sectionName: https
  hostnames:
    - slips.ruck.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: slipstream-web
          port: 80

---
# TCPRoute attaches to a Gateway listener with protocol: TCP.
# It does not support hostname matching (that is layer 7); the parentRef
# sectionName selects the specific TCP listener port.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: slipstream-web
  namespace: slipstream-system
spec:
  parentRefs:
    - name: slipstream-gateway
      namespace: slipstream-system
      sectionName: tcp
  rules:
    - backendRefs:
        - name: slipstream-web
          port: 80
