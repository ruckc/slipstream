apiVersion: v1
kind: Pod
metadata:
  name: agent-{{PROJECT_ID}}
  namespace: {{K8S_NAMESPACE}}
  labels:
    app: slipstream-agent
    slipstream.io/project: {{PROJECT_ID}}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: agent
      image: {{AGENT_IMAGE}}
      ports:
        - containerPort: 8080
          name: http
      env:
        - name: JWKS_URL
          value: "http://slipstream-web.slipstream-system.svc.cluster.local/api/jwks"
        - name: PROJECT_ID
          value: "{{PROJECT_ID}}"
        - name: IDLE_TIMEOUT_SECONDS
          value: "{{IDLE_TIMEOUT}}"
        - name: WORKSPACE_PATH
          value: /workspace
      volumeMounts:
        - name: workspace
          mountPath: /workspace
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    - name: metrics
      image: {{METRICS_SIDECAR_IMAGE}}
      env:
        - name: PROJECT_ID
          value: "{{PROJECT_ID}}"
        - name: PUSH_URL
          value: "http://victoriametrics.metrics.svc.cluster.local:8428"
        - name: PUSH_INTERVAL
          value: "30"
        - name: WORKSPACE_PATH
          value: /workspace
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: {{PVC_NAME}}
