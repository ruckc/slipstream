nameOverride: ""
fullnameOverride: ""

image:
  web:
    # Replace OWNER with your GitHub username or org.
    repository: ghcr.io/OWNER/slipstream-web
    tag: ""           # defaults to chart appVersion
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/OWNER/slipstream-agent
    tag: ""
    pullPolicy: IfNotPresent
  metricsSidecar:
    repository: ghcr.io/OWNER/slipstream-metrics-sidecar
    tag: ""
    pullPolicy: IfNotPresent

web:
  replicas: 2
  # Full public URL of the app (for OIDC redirect URIs and SvelteKit ORIGIN).
  # Defaults to https://{{ gateway.hostname }} when empty.
  appUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

database:
  # Required when postgresql.enabled is false.
  # Leave empty when postgresql.enabled is true — DATABASE_URL is derived automatically.
  url: ""

gateway:
  name: ""        # required: Gateway resource name
  namespace: ""   # required: Gateway resource namespace
  hostname: ""    # required: public hostname served by the gateway
  listeners:
    http: http    # sectionName of the HTTP listener
    https: https  # sectionName of the HTTPS (HTTPRoute) listener
    tls: tls      # sectionName of the TLS (TLSRoute) listener; used when certManager.enabled
  tcpRoute:
    enabled: false  # enable a TCPRoute for a raw TCP listener (e.g. TLS passthrough)
    listener: tcp   # sectionName of the TCP listener on the Gateway

certManager:
  enabled: false
  issuer:
    # "ClusterIssuer" (cluster-scoped) or "Issuer" (namespace-scoped).
    kind: ClusterIssuer
    acme:
      # Contact address for Let's Encrypt expiry notices. Required when enabled.
      email: ""
      # ACME directory URL.
      # Staging (for testing): https://acme-staging-v02.api.letsencrypt.org/directory
      server: https://acme-v02.api.letsencrypt.org/directory
  # nginx-unprivileged sidecar that terminates TLS on port 8443 and forwards
  # plain HTTP to the app on port 3000. The service maps external 443 → 8443.
  sidecar:
    image: nginxinc/nginx-unprivileged:stable-alpine
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi

auth:
  # When set, SESSION_SECRET, K8S_JWT_PRIVATE_KEY, and all OIDC credentials are
  # sourced from this pre-created Secret. Use scripts/create-auth-secret.sh to
  # create it. The chart-managed Secret will still hold DATABASE_URL (and
  # POSTGRES_PASSWORD when postgresql.enabled is true).
  existingSecret: ""
  # Ignored when auth.existingSecret is set.
  # Auto-generated on first install and preserved across upgrades via secret lookup.
  # Set explicitly if you need a known value (e.g. for multi-cluster setups).
  sessionSecret: ""
  # Ignored when auth.existingSecret is set.
  # Optional base64-encoded PKCS8 PEM. Leave empty to use an ephemeral
  # in-memory key — only suitable for single-replica deployments.
  jwtPrivateKey: ""
  google:
    clientId: ""
    clientSecret: ""
  microsoft:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""

# When set, skip rendering the chart-managed Secret entirely and reference this
# existing Secret for ALL env vars (DATABASE_URL, SESSION_SECRET, etc.).
# Takes precedence over auth.existingSecret.
existingSecret: ""

devMode:
  # Enables the /auth/dev login endpoint. Never set to true in production.
  enabled: false

victoriametrics:
  enabled: true
  namespace: metrics
  storage: 20Gi
  storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

postgresql:
  # Deploys a single-node PostgreSQL instance in the release namespace.
  # Suitable for development and testing; use a managed database for production.
  enabled: false
  database: slipstream
  user: slipstream
  # Auto-generated on first install and preserved across upgrades.
  # Set explicitly if external tools need a known credential.
  password: ""
  storage: 10Gi
  storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

agent:
  storageClass: standard
  idleTimeoutSeconds: 1800
