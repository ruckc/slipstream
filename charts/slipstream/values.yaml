nameOverride: ""
fullnameOverride: ""

image:
  web:
    # Replace OWNER with your GitHub username or org.
    repository: ghcr.io/ruckc/slipstream-web
    tag: "" # defaults to chart appVersion
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/ruckc/slipstream-agent
    tag: ""
    pullPolicy: IfNotPresent
  metricsCollector:
    repository: ghcr.io/ruckc/slipstream-metrics-collector
    tag: ""
    pullPolicy: IfNotPresent
  projectController:
    repository: ghcr.io/ruckc/slipstream-project-controller
    tag: "" # defaults to chart appVersion
    pullPolicy: IfNotPresent
  hubbleCollector:
    repository: ghcr.io/ruckc/slipstream-hubble-collector
    tag: "" # defaults to chart appVersion
    pullPolicy: IfNotPresent

  harborCollector:
    repository: ghcr.io/ruckc/slipstream-harbor-collector
    tag: "" # defaults to chart appVersion
    pullPolicy: IfNotPresent

  # Rootless BuildKit sidecar injected into project pods when registry is enabled.
  # Pinned by digest; override tag to use a different version.
  buildkit:
    repository: moby/buildkit
    tag: "" # when empty, digest is used instead
    digest: "sha256:cb5bb371545222c430528556acfdf424144b69897f5deaad391bd227187e90df" # v0.20.2-rootless

  # Cilium image used only as the source of the cilium-dbg binary for the
  # metrics-collector when metricsCollector.egressAccounting.enabled is true.
  # The tag MUST match the running Cilium version so the BPF map layout matches.
  cilium:
    repository: quay.io/cilium/cilium
    tag: "v1.19.4"

hubbleCollector:
  # Path to Cilium's Hubble static flow-log export file (per-node, under the
  # cilium-run hostPath). Requires hubble.export.static enabled in the Cilium
  # CNI with an allowlist on the slipstream.io/project-id source label.
  exportFile: "/var/run/cilium/hubble/events.log"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

web:
  replicas: 1
  # Full public URL of the app (for OIDC redirect URIs and SvelteKit ORIGIN).
  # Defaults to https://{{ gateway.hostname }} when empty.
  appUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

database:
  # Required when postgresql.enabled is false and database.pgopSecret.secretName is not set.
  # Leave empty when postgresql.enabled is true — DATABASE_URL is derived automatically.
  url: ""
  # When secretName is set, DATABASE_URL is assembled at pod start from the pgop Role
  # credentials secret via Kubernetes env-var substitution. Mutually exclusive with
  # database.url and postgresql.enabled.
  pgopSecret:
    secretName: "" # pgop Role credentials secret, e.g. "app-user-credentials"
    database: "" # postgres database name (matches the pgop Database CR name)
    sslmode: disable

gateway:
  name: "" # required: Gateway resource name
  namespace: "" # required: Gateway resource namespace
  hostname: "" # required: public hostname served by the gateway
  listeners:
    http: http # sectionName of the HTTP listener (port 80, for redirect + ACME)
    https: https # sectionName of the HTTPS listener (port 443, Terminate mode)
    harborHttps: harbor-https # sectionName of the Harbor HTTPS listener (port 443, registry.hostname)
  # Gateway data-plane proxy pod selector for NetworkPolicy ingress rules.
  # When proxyNamespace is set, ingress to project pods is restricted to the
  # proxy pod in that namespace. Leave empty on clusters where the gateway
  # uses hostNetwork (e.g. kind), where pod-selector matching doesn't work.
  proxyNamespace: "" # e.g. envoy-gateway-system
  proxyLabelKey: gateway.envoyproxy.io/owning-gateway-name
  proxyLabelValue: "" # defaults to gateway.name when empty

certManager:
  # When enabled, a ClusterIssuer and Certificate are created. The Certificate
  # is provisioned in gateway.namespace so the gateway listener can reference it
  # directly via spec.listeners[].tls.certificateRefs. TLS is terminated at the
  # gateway; all intra-cluster traffic travels as plain HTTP, encrypted at the
  # network layer by Cilium WireGuard.
  enabled: false
  issuer:
    acme:
      # Contact address for Let's Encrypt expiry notices. Required when enabled.
      email: ""
      # ACME directory URL.
      # Staging (for testing): https://acme-staging-v02.api.letsencrypt.org/directory
      server: https://acme-v02.api.letsencrypt.org/directory

auth:
  # When set, SESSION_SECRET, K8S_JWT_PRIVATE_KEY, and all OIDC credentials are
  # sourced from this pre-created Secret. Use scripts/create-auth-secret.sh to
  # create it. The chart-managed Secret will still hold DATABASE_URL (and
  # POSTGRES_PASSWORD when postgresql.enabled is true).
  existingSecret: ""
  # Comma-separated list of email addresses that are auto-promoted to the admin
  # role on login. Example: "alice@example.com,bob@example.com"
  adminEmails: ""
  # Ignored when auth.existingSecret is set.
  # Auto-generated on first install and preserved across upgrades via secret lookup.
  # Set explicitly if you need a known value (e.g. for multi-cluster setups).
  sessionSecret: ""
  # Ignored when auth.existingSecret is set.
  # Optional base64-encoded PKCS8 PEM. Leave empty to use an ephemeral
  # in-memory key — only suitable for single-replica deployments.
  jwtPrivateKey: ""
  google:
    clientId: ""
    clientSecret: ""
  microsoft:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""

# When set, skip rendering the chart-managed Secret entirely and reference this
# existing Secret for ALL env vars (DATABASE_URL, SESSION_SECRET, etc.).
# Takes precedence over auth.existingSecret.
existingSecret: ""

devMode:
  # Enables the /auth/dev login endpoint. Never set to true in production.
  enabled: false

postgresql:
  # Deploys a single-node PostgreSQL instance in the release namespace.
  # Suitable for development and testing; use a managed database for production.
  enabled: false
  database: slipstream
  user: slipstream
  # Auto-generated on first install and preserved across upgrades.
  # Set explicitly if external tools need a known credential.
  password: ""
  storage: 10Gi
  storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

agent:
  storageClass: standard
  idleTimeoutSeconds: 1800

# Namespace-scoped container registry (Harbor). When enabled, each Slipstream
# namespace maps to a private Harbor project; the web app provisions a robot
# account per namespace and the controller mounts its credentials into pods so
# in-pod builds can push/pull. Harbor itself is deployed out-of-band (its own
# Helm release); these values just point Slipstream at it.
registry:
  enabled: false
  # In-cluster Harbor API base URL used by the web app for admin calls.
  harborUrl: "" # e.g. http://harbor-core.harbor.svc.cluster.local
  # Registry host used in image references / docker login (host[:port]).
  host: "" # e.g. harbor-core.harbor.svc.cluster.local
  # Namespace where Harbor runs — pods are granted NetworkPolicy egress to it.
  namespace: harbor
  # Treat the registry as insecure (HTTP / self-signed). Dev only.
  insecure: false
  adminUsername: admin
  adminPassword: "" # required when enabled; stored in the web Secret
  # External hostname for the Harbor UI/API (e.g. harbor.example.com).
  # When set, HTTPRoutes are created to expose Harbor through the Gateway.
  hostname: ""
  # In-cluster service name for the Harbor nginx frontend (routes to portal, core, and registry).
  coreService: harbor
  corePort: 80

harborCollector:
  enabled: true
  scrapeIntervalSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Runs as a DaemonSet: one pod per node, each scraping only its own node's
# project pods via the kubelet/cAdvisor (CPU/memory/network) plus the
# Kubernetes API (PVC capacity). Scales automatically with the cluster.
metricsCollector:
  scrapeIntervalSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # External/internal egress byte accounting read from Cilium's BPF policy maps
  # (reserved:world identity = external egress, the billable number). Requires a
  # Cilium CNI; when enabled the collector runs as root with CAP_BPF and mounts
  # bpffs + the Cilium agent socket. Leave disabled on non-Cilium clusters.
  egressAccounting:
    enabled: false
