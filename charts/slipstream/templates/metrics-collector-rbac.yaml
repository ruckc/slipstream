apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-metrics-collector
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  # Discover project pods scheduled on this node and their PVCs.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  # Scrape cAdvisor metrics through the API server proxy (CPU/memory/network).
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-metrics-collector
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-metrics-collector
subjects:
  - kind: ServiceAccount
    name: slipstream-metrics-collector
    namespace: {{ .Release.Namespace }}
