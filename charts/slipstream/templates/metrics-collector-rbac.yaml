apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-metrics-collector
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  - apiGroups: ["slipstream.io"]
    resources: ["projectenvironments"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-metrics-collector
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-metrics-collector
subjects:
  - kind: ServiceAccount
    name: slipstream-metrics-collector
    namespace: {{ .Release.Namespace }}
