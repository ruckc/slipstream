{{- if .Values.victoriametrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: {{ .Values.victoriametrics.namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=3
            - -httpListenAddr=:8428
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.victoriametrics.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoriametrics-data
{{- end }}
