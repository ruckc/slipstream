apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
{{- if .Values.devMode.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-web-dev
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  # Allow seed.mjs to create user namespaces (dev mode only)
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-web-dev
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-web-dev
subjects:
  - kind: ServiceAccount
    name: slipstream-web
    namespace: {{ .Release.Namespace }}
{{- end }}
