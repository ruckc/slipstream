{{- if .Values.metricsCollector.hpa.enabled }}
# Requires prometheus-adapter configured to surface slipstream_collector_saturation_ratio
# as a custom metric. See https://github.com/kubernetes-sigs/prometheus-adapter for setup.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slipstream-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: slipstream-metrics-collector
  minReplicas: {{ .Values.metricsCollector.hpa.minReplicas }}
  maxReplicas: {{ .Values.metricsCollector.hpa.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: slipstream_collector_saturation_ratio
        target:
          type: AverageValue
          averageValue: {{ .Values.metricsCollector.hpa.targetSaturation }}
{{- end }}
