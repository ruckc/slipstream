apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: slipstream-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
    app: slipstream-metrics-collector
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: slipstream-metrics-collector
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "slipstream.labels" . | nindent 8 }}
        app: slipstream-metrics-collector
    spec:
      serviceAccountName: slipstream-metrics-collector
      automountServiceAccountToken: true
      {{- if .Values.metricsCollector.egressAccounting.enabled }}
      # Reading Cilium's pinned BPF policy maps requires root + CAP_BPF and a
      # bind-mount of bpffs (mode 700, files owned by root). Scoped to this
      # node-local collector only when egress accounting is enabled.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      initContainers:
        # Copy the version-matched cilium-dbg binary out of the Cilium image so
        # the collector reads policy maps with a CLI that matches the running
        # agent's map layout (no struct coupling in our own code).
        - name: copy-cilium-dbg
          image: {{ include "slipstream.ciliumImage" . }}
          command: ["sh", "-c", "cp /usr/bin/cilium-dbg /cilium-bin/cilium-dbg"]
          volumeMounts:
            - name: cilium-bin
              mountPath: /cilium-bin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      {{- end }}
      containers:
        - name: metrics-collector
          image: {{ include "slipstream.metricsCollectorImage" . }}
          imagePullPolicy: {{ .Values.image.metricsCollector.pullPolicy }}
          ports:
            - containerPort: 8080
              name: metrics
          env:
            {{- include "slipstream.databaseEnv" . | nindent 12 }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SCRAPE_INTERVAL_SECONDS
              value: {{ .Values.metricsCollector.scrapeIntervalSeconds | quote }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slipstream-web-secret
                  key: METRICS_TOKEN
            {{- if .Values.metricsCollector.egressAccounting.enabled }}
            - name: EGRESS_ACCOUNTING_ENABLED
              value: "true"
            - name: CILIUM_DBG_PATH
              value: /cilium-bin/cilium-dbg
            {{- end }}
          volumeMounts:
            {{- if .Values.metricsCollector.egressAccounting.enabled }}
            - name: cilium-bin
              mountPath: /cilium-bin
              readOnly: true
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: cilium-run
              mountPath: /var/run/cilium
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.metricsCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              {{- if .Values.metricsCollector.egressAccounting.enabled }}
              drop: ["ALL"]
              add: ["BPF", "PERFMON"]
              {{- else }}
              drop: ["ALL"]
              {{- end }}
      volumes:
        {{- if .Values.metricsCollector.egressAccounting.enabled }}
        - name: cilium-bin
          emptyDir: {}
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: cilium-run
          hostPath:
            path: /var/run/cilium
            type: Directory
        {{- end }}
