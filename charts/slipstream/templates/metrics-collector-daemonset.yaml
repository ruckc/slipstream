apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: slipstream-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
    app: slipstream-metrics-collector
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: slipstream-metrics-collector
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "slipstream.labels" . | nindent 8 }}
        app: slipstream-metrics-collector
    spec:
      serviceAccountName: slipstream-metrics-collector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: metrics-collector
          image: {{ include "slipstream.metricsCollectorImage" . }}
          imagePullPolicy: {{ .Values.image.metricsCollector.pullPolicy }}
          ports:
            - containerPort: 8080
              name: metrics
          env:
            {{- include "slipstream.databaseEnv" . | nindent 12 }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SCRAPE_INTERVAL_SECONDS
              value: {{ .Values.metricsCollector.scrapeIntervalSeconds | quote }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slipstream-web-secret
                  key: METRICS_TOKEN
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.metricsCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
