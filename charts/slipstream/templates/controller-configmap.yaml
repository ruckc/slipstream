apiVersion: v1
kind: ConfigMap
metadata:
  name: slipstream-controller-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
data:
  AGENT_IMAGE: {{ include "slipstream.agentImage" . | quote }}
  AGENT_STORAGE_CLASS: {{ .Values.agent.storageClass | quote }}
  GATEWAY_NAME: {{ .Values.gateway.name | quote }}
  GATEWAY_NAMESPACE: {{ .Values.gateway.namespace | quote }}
  GATEWAY_HOSTNAME: {{ .Values.gateway.hostname | quote }}
  GATEWAY_LISTENER_HTTPS: {{ .Values.gateway.listeners.https | quote }}
  DEFAULT_IDLE_TIMEOUT_SECONDS: {{ .Values.agent.idleTimeoutSeconds | quote }}
  {{- if .Values.registry.enabled }}
  HARBOR_NAMESPACE: {{ .Values.registry.namespace | quote }}
  REGISTRY_INSECURE: {{ .Values.registry.insecure | quote }}
  BUILDKIT_IMAGE: {{ include "slipstream.buildkitImage" . | quote }}
  # Harbor provisioning (project + push/pull robots) is performed by the controller.
  HARBOR_URL: {{ .Values.registry.harborUrl | quote }}
  HARBOR_ADMIN_USERNAME: {{ .Values.registry.adminUsername | quote }}
  # REGISTRY_HOST is the host pods build/push to AND the docker-config auth key.
  # Prefer the public hostname (valid TLS via the gateway) over the in-cluster
  # service (HTTP-only, would need insecure-registry config); fall back to the
  # in-cluster host when no public hostname is configured.
  REGISTRY_HOST: {{ .Values.registry.hostname | default .Values.registry.host | quote }}
  {{- end }}
