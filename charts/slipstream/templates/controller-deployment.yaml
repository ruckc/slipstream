apiVersion: apps/v1
kind: Deployment
metadata:
  name: slipstream-project-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: project-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slipstream-project-controller
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
      labels:
        app: slipstream-project-controller
        {{- include "slipstream.labels" . | nindent 8 }}
    spec:
      serviceAccountName: slipstream-project-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: controller
          image: {{ include "slipstream.projectControllerImage" . }}
          imagePullPolicy: {{ .Values.image.projectController.pullPolicy }}
          envFrom:
            - configMapRef:
                name: slipstream-controller-config
          env:
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slipstream-web-secret
                  key: METRICS_TOKEN
            {{- if .Values.registry.enabled }}
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slipstream-web-secret
                  key: HARBOR_ADMIN_PASSWORD
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
