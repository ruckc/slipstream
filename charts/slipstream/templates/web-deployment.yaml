apiVersion: apps/v1
kind: Deployment
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "slipstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "slipstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: slipstream-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: {{ include "slipstream.webImage" . }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: slipstream-web-config
            - secretRef:
                name: {{ include "slipstream.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/jwks
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/jwks
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
        {{- if .Values.certManager.enabled }}
        - name: tls-proxy
          image: {{ .Values.certManager.sidecar.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.certManager.sidecar.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 20
        {{- end }}
      {{- if .Values.certManager.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "slipstream.tlsSecretName" . }}
        - name: nginx-config
          configMap:
            name: {{ include "slipstream.fullname" . }}-nginx
      {{- end }}
