apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slipstream.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # post-install: Secret already exists, runs after resources are created on first install.
    # pre-upgrade:  runs before the Deployment rolls, so new schema is in place before new pods start.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "slipstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: slipstream-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ['sh', '-c', 'until pg_isready -d "$DATABASE_URL"; do echo "waiting for postgres"; sleep 2; done']
          env:
            {{- include "slipstream.databaseEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: migrate
          image: {{ include "slipstream.webImage" . }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          command: ["node", "migrate.mjs"]
          env:
            {{- include "slipstream.databaseEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
