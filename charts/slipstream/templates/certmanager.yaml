{{- if .Values.certManager.enabled }}
---
# ClusterIssuer is required when certManager is enabled because the Certificate
# is created in gateway.namespace (so the gateway can reference it directly via
# certificateRefs), which may differ from the release namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "slipstream.fullname" . }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.certManager.issuer.acme.email | quote }}
    server: {{ .Values.certManager.issuer.acme.server | quote }}
    privateKeySecretRef:
      name: {{ include "slipstream.fullname" . }}-acme-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.gateway.name }}
                namespace: {{ .Values.gateway.namespace }}
                kind: Gateway
---
# Certificate lives in the gateway namespace so the gateway listener can
# reference it directly in spec.listeners[].tls.certificateRefs without a
# cross-namespace ReferenceGrant.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "slipstream.fullname" . }}-tls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  secretName: {{ include "slipstream.tlsSecretName" . }}
  dnsNames:
    - {{ .Values.gateway.hostname | quote }}
  issuerRef:
    name: {{ include "slipstream.fullname" . }}
    kind: ClusterIssuer
{{- end }}
