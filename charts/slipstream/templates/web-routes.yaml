---
# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slipstream-web-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listeners.http }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

{{- if .Values.certManager.enabled }}
---
# TLS passthrough — the Gateway forwards raw TLS to the backend based on SNI;
# the pod terminates TLS using the cert-manager Secret mounted at /etc/tls.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listeners.tls }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: slipstream-web
          port: 443
{{- else }}
---
# HTTPS traffic — no cert-manager; assumes the Gateway's HTTPS listener already
# has TLS configured externally (sectionName: {{ .Values.gateway.listeners.https }}).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listeners.https }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: slipstream-web
          port: 80
{{- end }}
{{- if .Values.gateway.tcpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.tcpRoute.listener }}
  rules:
    - backendRefs:
        - name: slipstream-web
          port: 80
{{- end }}
