apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: slipstream-hubble-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: hubble-collector
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: slipstream-hubble-collector
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
      labels:
        app: slipstream-hubble-collector
        {{- include "slipstream.labels" . | nindent 8 }}
    spec:
      serviceAccountName: slipstream-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: hubble-collector
          image: {{ include "slipstream.hubbleCollectorImage" . }}
          imagePullPolicy: {{ .Values.image.hubbleCollector.pullPolicy }}
          env:
            - name: HUBBLE_EXPORT_FILE
              value: {{ .Values.hubbleCollector.exportFile | quote }}
            {{- include "slipstream.databaseEnv" . | nindent 12 }}
          {{- if .Values.database.pgopSecret.secretName }}
          envFrom: []
          {{- else }}
          envFrom:
            - secretRef:
                name: {{ include "slipstream.secretName" . }}
          {{- end }}
          volumeMounts:
            # Cilium's Hubble static export file, written per-node under the
            # cilium-run hostPath. Read-only; the file is world-readable so the
            # collector stays non-root.
            - name: hubble-export
              mountPath: /var/run/cilium/hubble
              readOnly: true
          resources:
            {{- toYaml .Values.hubbleCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: hubble-export
          hostPath:
            path: /var/run/cilium/hubble
            type: Directory
