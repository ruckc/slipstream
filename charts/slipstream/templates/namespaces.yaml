{{- if .Values.victoriametrics.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.victoriametrics.namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
{{- end }}
