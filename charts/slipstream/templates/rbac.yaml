apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-web
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  # Manage project lifecycle via CRD only
  - apiGroups: [slipstream.io]
    resources: [projectenvironments]
    verbs: [get, list, watch, create, patch, delete]

  # Read pod status and logs for the UI (scoped to project namespaces ideally)
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-web
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: slipstream-web
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: slipstream-web
  apiGroup: rbac.authorization.k8s.io
