{{- if not .Values.existingSecret }}

{{- /*
  Lookup the existing secret to preserve generated values across helm upgrade.
  During `helm template` / lint, lookup always returns empty — that's fine.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "slipstream-web-secret" }}

{{- /* ── Session secret: explicit > preserved > generated (skipped when auth.existingSecret is set) ── */}}
{{- $sessionSecret := "" }}
{{- if not .Values.auth.existingSecret }}
  {{- $sessionSecret = .Values.auth.sessionSecret }}
  {{- if not $sessionSecret }}
    {{- if and $existing (index $existing.data "SESSION_SECRET") }}
      {{- $sessionSecret = index $existing.data "SESSION_SECRET" | b64dec }}
    {{- else }}
      {{- $sessionSecret = randAlphaNum 32 }}
    {{- end }}
  {{- end }}
{{- end }}

{{- /* ── PostgreSQL password: explicit > preserved > generated ── */}}
{{- $pgPassword := "" }}
{{- if .Values.postgresql.enabled }}
  {{- if .Values.postgresql.password }}
    {{- $pgPassword = .Values.postgresql.password }}
  {{- else if and $existing (index $existing.data "POSTGRES_PASSWORD") }}
    {{- $pgPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- else }}
    {{- $pgPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}

{{- /* ── Database URL: explicit > preserved > derived from in-cluster postgres ── */}}
{{- $dbUrl := .Values.database.url }}
{{- if not $dbUrl }}
  {{- if and $existing (index $existing.data "DATABASE_URL") }}
    {{- $dbUrl = index $existing.data "DATABASE_URL" | b64dec }}
  {{- else if .Values.postgresql.enabled }}
    {{- $dbUrl = printf "postgresql://%s:%s@slipstream-postgres.%s.svc.cluster.local:5432/%s?sslmode=disable" .Values.postgresql.user $pgPassword .Release.Namespace .Values.postgresql.database }}
  {{- end }}
{{- end }}
{{- if not $dbUrl }}
  {{- fail "database.url is required when postgresql.enabled is false" }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: slipstream-web-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret }}
  SESSION_SECRET: {{ $sessionSecret | quote }}
  {{- with .Values.auth.adminEmails }}
  ADMIN_EMAILS: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwtPrivateKey }}
  K8S_JWT_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.google.clientId }}
  GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.microsoft.clientId }}
  MICROSOFT_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.microsoft.clientSecret }}
  MICROSOFT_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.github.clientId }}
  GITHUB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.github.clientSecret }}
  GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
