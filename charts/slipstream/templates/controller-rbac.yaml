apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-project-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-project-controller
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  # ProjectEnvironment CRD — cluster-scoped
  - apiGroups: [slipstream.io]
    resources: [projectenvironments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [slipstream.io]
    resources: [projectenvironments/status]
    verbs: [get, update, patch]
  - apiGroups: [slipstream.io]
    resources: [projectenvironments/finalizers]
    verbs: [update]
  # Namespaces — cluster-scoped
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, delete]
  # Core resources — namespaced (in project-* namespaces)
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Deployments
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # NetworkPolicy
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Gateway API HTTPRoutes
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Cilium CRDs
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Lease for potential future leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-project-controller
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-project-controller
subjects:
  - kind: ServiceAccount
    name: slipstream-project-controller
    namespace: {{ .Release.Namespace }}
