apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipstream-project-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slipstream-project-controller
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
rules:
  # ProjectEnvironment CRD — cluster-scoped
  - apiGroups: [slipstream.io]
    resources: [projectenvironments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [slipstream.io]
    resources: [projectenvironments/status]
    verbs: [get, update, patch]
  - apiGroups: [slipstream.io]
    resources: [projectenvironments/finalizers]
    verbs: [update]
  # Namespaces — cluster-scoped
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Endpoints in default namespace — to resolve the API server's real IP for Cilium egress rules
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  # Core resources — namespaced (in project-* namespaces)
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services, serviceaccounts, secrets, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  # Pod sub-resources granted to project-agent; controller must hold them to escalate
  - apiGroups: [""]
    resources: [pods/log, pods/exec]
    verbs: [get, create]
  # Deployments
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Jobs and CronJobs
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Services — controller grants project-agent access to these; must hold them itself
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # RBAC — for managing project-agent Role/RoleBinding per project namespace
  # escalate is required so the controller can grant verbs it holds to project Roles
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  # NetworkPolicy
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Gateway API HTTPRoutes
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Cilium CRDs
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Lease for potential future leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slipstream-project-controller
  labels:
    {{- include "slipstream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slipstream-project-controller
subjects:
  - kind: ServiceAccount
    name: slipstream-project-controller
    namespace: {{ .Release.Namespace }}
