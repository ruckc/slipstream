# Non-production dev mode overlay.
#
# Install with:
#   helm install slipstream ./charts/slipstream \
#     -f charts/slipstream/values-dev.yaml \
#     --set gateway.name=slipstream \
#     --set gateway.namespace=slipstream-system \
#     --set gateway.hostname=localhost \
#     --namespace slipstream-system \
#     --create-namespace
#
# PostgreSQL is enabled by default in dev — database.url and auth.sessionSecret
# are auto-generated and stored in the release Secret.

devMode:
  enabled: true

image:
  web:
    repository: localhost:5001/slipstream-web
    tag: local
    pullPolicy: Always
  agent:
    repository: localhost:5001/slipstream-agent
    tag: local
    pullPolicy: Always
  metricsCollector:
    repository: localhost:5001/slipstream-metrics-collector
    tag: local
    pullPolicy: Always
  projectController:
    repository: localhost:5001/slipstream-project-controller
    tag: local
    pullPolicy: Always

web:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

agent:
  idleTimeoutSeconds: 300

# Dev registry: Harbor (namespace "harbor") backed by rustfs S3, both installed
# by `mise run dev:cluster`. Reached in-cluster over HTTP, so insecure=true.
registry:
  enabled: true
  harborUrl: http://harbor-core.harbor.svc.cluster.local
  host: harbor-core.harbor.svc.cluster.local
  namespace: harbor
  insecure: true
  adminUsername: admin
  adminPassword: Harbor12345

postgresql:
  enabled: true
  storage: 2Gi

