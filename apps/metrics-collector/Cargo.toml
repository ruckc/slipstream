[package]
name = "slipstream-metrics-collector"
version = "0.50.0"
edition = "2021"

[[bin]]
name = "metrics-collector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23", features = ["ring"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }
kube = { version = "3.1.0", features = ["runtime", "client", "rustls-tls", "ring"], default-features = false }
k8s-openapi = { version = "0.27.1", features = ["v1_32"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = "0.7"
futures-util = "0.3"
