apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectenvironments.slipstream.io
spec:
  group: slipstream.io
  scope: Cluster
  names:
    plural: projectenvironments
    singular: projectenvironment
    kind: ProjectEnvironment
    shortNames:
      - pe
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectId, namespaceId, namespaceSlug, projectSlug, desiredState, idleTimeoutSeconds, retainStorage, egressPolicy]
              properties:
                projectId:
                  type: string
                namespaceId:
                  type: string
                namespaceSlug:
                  type: string
                  minLength: 1
                projectSlug:
                  type: string
                  minLength: 1
                desiredState:
                  type: string
                  enum: [running, stopped]
                idleTimeoutSeconds:
                  type: integer
                  minimum: 60
                retainStorage:
                  type: boolean
                  default: true
                egressPolicy:
                  type: object
                  required: [enabled]
                  properties:
                    enabled:
                      type: boolean
                    rules:
                      type: array
                      items:
                        type: object
                        required: [domain, ports, ruleType]
                        properties:
                          domain:
                            type: string
                          ports:
                            type: array
                            items:
                              type: integer
                          ruleType:
                            type: string
                            enum: [allow, deny]
                kubeDeployAccess:
                  type: boolean
                  default: false
                storageGB:
                  type: integer
                  minimum: 1
                  default: 10
                registryAuth:
                  type: object
                  required: [server, username, password]
                  properties:
                    server:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Running, Stopping, Stopped, Error]
                podIP:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PodIP
          type: string
          jsonPath: .status.podIP
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
