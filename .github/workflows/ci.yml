name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # push main/SHA-tagged images on branch push

jobs:
  # ── Checks (format, lint, type-check, test) ────────────────────────────────
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # ── Kind integration test: schema validation against live API server ────────
  # Only runs on push to main (same gate as build-edge) to keep PR CI fast.
  kind-test:
    name: Kind — Schema Validation
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: slipstream-test
          version: v0.24.0

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
          # Brief pause: status.conditions is nil immediately after creation and
          # kubectl wait returns an accessor error if it runs before the API server
          # has had a chance to populate it.
          sleep 5
          kubectl wait --for condition=established --timeout=60s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/grpcroutes.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/referencegrants.gateway.networking.k8s.io

      - name: Pre-create slipstream-system namespace
        run: kubectl create namespace slipstream-system

      - name: Server-side dry-run
        run: |
          helm template slipstream charts/slipstream \
            -f charts/slipstream/ci/values.yaml \
            --namespace slipstream-system \
            | kubectl apply --dry-run=server -f -

  # ── Build and push edge images (main branch only, not PRs) ─────────────────
  build-edge:
    name: Build Edge — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64
          - name: agent
            dockerfile: docker/agent/Dockerfile
            platforms: linux/amd64
          - name: metrics-sidecar
            dockerfile: docker/metrics-sidecar/Dockerfile
            platforms: linux/amd64
          - name: project-controller
            dockerfile: docker/project-controller/Dockerfile
            platforms: linux/amd64
          - name: hubble-collector
            dockerfile: docker/hubble-collector/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipstream-${{ matrix.image.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.image.platforms }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  # ── Auto-trigger release once all main-branch checks and builds pass ────────
  # Skipped on PRs and on commits made by the release workflow itself (version
  # bump commits start with "chore: release") to prevent an infinite loop.
  trigger-release:
    name: Trigger Release
    runs-on: ubuntu-latest
    needs: [checks, kind-test, build-edge]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    permissions:
      actions: write
    steps:
      - name: Dispatch release workflow
        run: gh workflow run release.yml --repo ${{ github.repository }} --field skip_checks=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
