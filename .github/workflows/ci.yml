name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # push main/SHA-tagged images on branch push

jobs:
  # ── Web app: format, lint, type-check ──────────────────────────────────────
  check-web:
    name: Web — Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @slipstream/web format:check

      - name: Lint
        run: pnpm --filter @slipstream/web lint

      - name: Type check
        run: pnpm --filter @slipstream/web check

  # ── Rust agent: format, clippy, test ───────────────────────────────────────
  check-rust:
    name: Rust — Format · Clippy · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent -> target

      - name: Check formatting
        working-directory: apps/agent
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/agent
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: apps/agent
        run: cargo test

  # ── Go metrics sidecar: format, vet, build ─────────────────────────────────
  check-go:
    name: Go — Format · Vet · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/metrics-sidecar/go.mod

      - name: Check formatting
        working-directory: apps/metrics-sidecar
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: apps/metrics-sidecar
        run: go vet ./...

      - name: Build
        working-directory: apps/metrics-sidecar
        run: go build ./...

  # ── Build and push edge images (main branch only, not PRs) ─────────────────
  build-edge:
    name: Build Edge — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [check-web, check-rust, check-go]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: agent
            dockerfile: docker/agent/Dockerfile
            platforms: linux/amd64
          - name: metrics-sidecar
            dockerfile: docker/metrics-sidecar/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipstream-${{ matrix.image.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.image.platforms }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
