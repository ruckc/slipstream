name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (leave empty to auto-detect from conventional commits)'
        required: false
        default: ''
        type: choice
        options: ['', 'patch', 'minor', 'major']

# Serialize runs so a new push to main queues behind an in-progress release
# rather than racing it. cancel-in-progress: false ensures the running build
# is never interrupted by a newer push.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: write   # commit version bump, push tag, create GitHub Release
  packages: write   # push versioned images and Helm chart to GHCR

jobs:
  # ── Checks (format, lint, type-check, test) ────────────────────────────────
  # Always run on PRs and workflow_dispatch; skip on the version-bump commit
  # that this workflow pushes (message starts with "chore: release") to avoid
  # re-running the full pipeline on that commit.
  checks:
    name: Checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: release')
    uses: ./.github/workflows/checks.yml

  # ── Compute version, update files, and push to a staging branch ────────────
  # Creates the version-bump commit and pushes it to release-staging (not main)
  # so that build jobs check out the exact commit that will be tagged, embedding
  # the right git hash in binaries. main is only updated in finalize if all
  # builds and validation pass.
  version:
    name: Version
    runs-on: ubuntu-latest
    needs: checks
    if: |
      always() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore: release')
        )
      )
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag:     ${{ steps.next.outputs.tag }}
      sha:     ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Find current version from last semver tag ──────────────────────
      - name: Resolve current version
        id: current
        run: |
          tag=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null \
                || echo "v0.0.0")
          echo "tag=$tag"             >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"     >> "$GITHUB_OUTPUT"
          echo "Current version: $tag"

      # ── 2. Analyse commits since last tag using conventional commit rules ──
      #   BREAKING CHANGE or type! → major
      #   feat                     → minor
      #   anything else            → patch
      - name: Detect bump type
        id: detect
        run: |
          LAST="${{ steps.current.outputs.tag }}"
          OVERRIDE="${{ inputs.bump }}"

          if [ -n "$OVERRIDE" ]; then
            echo "type=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Bump overridden to: $OVERRIDE"
            exit 0
          fi

          if [ "$LAST" = "v0.0.0" ]; then
            LOG=$(git log --pretty=format:"%s" HEAD)
          else
            LOG=$(git log --pretty=format:"%s" "${LAST}..HEAD")
          fi

          if [ -z "$LOG" ]; then
            echo "::error::No commits found since $LAST — nothing to release."
            exit 1
          fi

          BUMP="patch"
          while IFS= read -r msg; do
            if printf '%s' "$msg" | grep -qE '^[a-z]+(\([^)]+\))?!:' || \
               printf '%s' "$msg" | grep -q 'BREAKING CHANGE:'; then
              BUMP="major"
              break
            fi
            if printf '%s' "$msg" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            fi
          done <<< "$LOG"

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump: $BUMP"
          echo ""
          echo "Commits since $LAST:"
          echo "$LOG"

      # ── 3. Compute the next version string ───────────────────────────────
      - name: Calculate next version
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
          case "${{ steps.detect.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          V="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$V"  >> "$GITHUB_OUTPUT"
          echo "tag=v${V}"   >> "$GITHUB_OUTPUT"
          echo "Next version: v${V}  (bump: ${{ steps.detect.outputs.type }})"

      # ── 4. Write the new version into every component ────────────────────
      - name: Update version files
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          echo "$VERSION" > VERSION

          node -e "
            const fs  = require('fs')
            const pkg = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync('apps/web/package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

          pip install --quiet tomlkit
          python3 - << 'PYEOF'
          import tomlkit, os
          path = 'apps/agent/Cargo.toml'
          ver  = os.environ['VERSION']
          with open(path) as f:
              doc = tomlkit.load(f)
          doc['package']['version'] = ver
          with open(path, 'w') as f:
              f.write(tomlkit.dumps(doc))
          PYEOF

          python3 - << 'PYEOF'
          import os
          ver = os.environ['VERSION']
          content = f'package main\n\n// Version is set at release time by the CI pipeline.\nconst Version = "{ver}"\n'
          open('apps/metrics-sidecar/version.go', 'w').write(content)
          PYEOF

          python3 - << 'PYEOF'
          import os
          ver = os.environ['VERSION']
          content = f'package main\n\n// Version is set at release time by the CI pipeline.\nconst Version = "{ver}"\n'
          open('apps/project-controller/version.go', 'w').write(content)
          PYEOF

          python3 - << 'PYEOF'
          import os
          ver = os.environ['VERSION']
          content = f'package main\n\n// Version is set at release time by the CI pipeline.\nvar Version = "{ver}"\n'
          open('apps/hubble-collector/version.go', 'w').write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re, os
          ver  = os.environ['VERSION']
          path = 'apps/agent/Cargo.lock'
          with open(path) as f:
              content = f.read()
          content = re.sub(
              r'(name = "slipstream-agent"\nversion = )"[^"]+"',
              rf'\1"{ver}"',
              content
          )
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re, os
          ver  = os.environ['VERSION']
          path = 'charts/slipstream/Chart.yaml'
          with open(path) as f:
              content = f.read()
          content = re.sub(r'^version:.*$',    f'version: {ver}',      content, flags=re.MULTILINE)
          content = re.sub(r'^appVersion:.*$', f'appVersion: "{ver}"', content, flags=re.MULTILINE)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

          echo "VERSION:                    $(cat VERSION)"
          echo "package.json:               $(node -p "require('./apps/web/package.json').version")"
          echo "Cargo.toml:                 $(grep '^version' apps/agent/Cargo.toml | head -1)"
          echo "metrics-sidecar/version.go: $(grep Version apps/metrics-sidecar/version.go)"
          echo "controller/version.go:      $(grep Version apps/project-controller/version.go)"
          echo "hubble-collector/version.go:$(grep Version apps/hubble-collector/version.go)"
          echo "Chart.yaml:                 $(grep '^version:' charts/slipstream/Chart.yaml)"

      # ── 5. Commit to a staging branch — main is untouched until finalize ─
      - name: Commit and push to staging branch
        id: commit
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TAG:     ${{ steps.next.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION \
                  apps/web/package.json \
                  apps/agent/Cargo.toml \
                  apps/agent/Cargo.lock \
                  apps/metrics-sidecar/version.go \
                  apps/project-controller/version.go \
                  apps/hubble-collector/version.go \
                  charts/slipstream/Chart.yaml

          git commit -m "chore: release ${TAG}"

          # Push to a staging branch so build jobs can check out this exact
          # commit by SHA. main is not touched until finalize confirms success.
          git push origin HEAD:refs/heads/release-staging --force

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Build and push versioned images from the staging commit ────────────────
  build:
    name: Build & Push — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64
          - name: agent
            dockerfile: docker/agent/Dockerfile
            platforms: linux/amd64
          - name: metrics-sidecar
            dockerfile: docker/metrics-sidecar/Dockerfile
            platforms: linux/amd64
          - name: project-controller
            dockerfile: docker/project-controller/Dockerfile
            platforms: linux/amd64
          - name: hubble-collector
            dockerfile: docker/hubble-collector/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Set up sccache
        if: matrix.image.name == 'agent'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipstream-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.image.platforms }}
          cache-from: |
            type=gha,scope=release-${{ matrix.image.name }}
            type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}
          secrets: ${{ matrix.image.name == 'agent' && format('actions_cache_url={0}{1}actions_runtime_token={2}', env.ACTIONS_CACHE_URL, '\n', env.ACTIONS_RUNTIME_TOKEN) || '' }}

  # ── Kind integration test: schema validation against live API server ────────
  # Runs in parallel with build against the staging commit. Both must pass
  # before the staging commit is promoted to main.
  kind-test:
    name: Kind — Schema Validation
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: slipstream-test
          version: v0.24.0

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
          sleep 5
          kubectl wait --for condition=established --timeout=60s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/grpcroutes.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/referencegrants.gateway.networking.k8s.io

      - name: Pre-create slipstream-system namespace
        run: kubectl create namespace slipstream-system

      - name: Server-side dry-run
        run: |
          helm template slipstream charts/slipstream \
            -f charts/slipstream/ci/values.yaml \
            --namespace slipstream-system \
            | kubectl apply --dry-run=server -f -

  # ── Promote staging commit to main, tag, publish chart, create release ──────
  # Fast-forward merges the staging commit onto main, pushes the tag, publishes
  # the Helm chart, and creates the GitHub Release. On failure the staging
  # branch is deleted and main is left untouched.
  finalize:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [version, build, kind-test]
    if: always() && needs.version.result == 'success' && needs.build.result == 'success' && needs.kind-test.result == 'success'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging commit to main and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fast-forward main to the staging commit. Fails loudly if main has
          # diverged (concurrent push during builds), which is the safe default.
          git push origin HEAD:refs/heads/main

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          git push origin --delete release-staging

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push Helm chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p /tmp/charts
          helm package charts/slipstream \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/charts
          helm push /tmp/charts/slipstream-${VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: helm-chart
          path: /tmp/charts/slipstream-*.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: /tmp/charts/slipstream-*.tgz
          append_body: true
          body: |

            ---

            ## Helm Chart

            ```bash
            helm install slipstream \
              oci://ghcr.io/${{ github.repository_owner }}/charts/slipstream \
              --version ${{ needs.version.outputs.version }} \
              --namespace slipstream-system \
              --create-namespace \
              --set database.url=postgresql://... \
              --set auth.sessionSecret=... \
              --set gateway.name=... \
              --set gateway.namespace=... \
              --set gateway.hostname=...
            ```

            ## Container Images

            ```
            ghcr.io/${{ github.repository_owner }}/slipstream-web:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/slipstream-agent:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/slipstream-metrics-sidecar:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/slipstream-project-controller:${{ needs.version.outputs.version }}
            ```

  # ── Clean up staging branch on build/test failure ──────────────────────────
  cleanup-on-failure:
    name: Cleanup Staging Branch
    runs-on: ubuntu-latest
    needs: [version, build, kind-test]
    if: always() && needs.version.result == 'success' && (needs.build.result == 'failure' || needs.kind-test.result == 'failure')
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete staging branch
        run: git push origin --delete release-staging || true
