name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # push main/SHA-tagged images on branch push

jobs:
  # ── Web app: format, lint, type-check ──────────────────────────────────────
  check-web:
    name: Web — Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @slipstream/web format:check

      - name: Lint
        run: pnpm --filter @slipstream/web lint

      - name: Type check
        run: pnpm --filter @slipstream/web check

  # ── Rust agent: format, clippy, test ───────────────────────────────────────
  check-rust:
    name: Rust — Format · Clippy · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent -> target

      - name: Check formatting
        working-directory: apps/agent
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/agent
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: apps/agent
        run: cargo test

  # ── Go metrics sidecar: format, vet, build ─────────────────────────────────
  check-go:
    name: Go — Format · Vet · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: apps/metrics-sidecar/go.mod
          cache-dependency-path: apps/metrics-sidecar/go.sum

      - name: Check formatting
        working-directory: apps/metrics-sidecar
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: apps/metrics-sidecar
        run: go vet ./...

      - name: Build
        working-directory: apps/metrics-sidecar
        run: go build ./...

  # ── Helm chart: lint and template rendering ─────────────────────────────────
  check-helm:
    name: Helm — Lint · Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint
        run: helm lint charts/slipstream

      - name: Render with CI values
        run: helm template slipstream charts/slipstream -f charts/slipstream/ci/values.yaml > /dev/null

  # ── Kind integration test: schema validation against live API server ────────
  # Only runs on push to main (same gate as build-edge) to keep PR CI fast.
  kind-test:
    name: Kind — Schema Validation
    runs-on: ubuntu-latest
    needs: check-helm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: slipstream-test

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
          # Brief pause: status.conditions is nil immediately after creation and
          # kubectl wait returns an accessor error if it runs before the API server
          # has had a chance to populate it.
          sleep 5
          kubectl wait --for condition=established --timeout=60s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/grpcroutes.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/referencegrants.gateway.networking.k8s.io

      - name: Pre-create slipstream-system namespace
        run: kubectl create namespace slipstream-system

      - name: Server-side dry-run
        run: |
          helm template slipstream charts/slipstream \
            -f charts/slipstream/ci/values.yaml \
            --namespace slipstream-system \
            | kubectl apply --dry-run=server -f -

  # ── Build and push edge images (main branch only, not PRs) ─────────────────
  build-edge:
    name: Build Edge — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [check-web, check-rust, check-go, check-helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64
          - name: agent
            dockerfile: docker/agent/Dockerfile
            platforms: linux/amd64
          - name: metrics-sidecar
            dockerfile: docker/metrics-sidecar/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipstream-${{ matrix.image.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.image.platforms }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
