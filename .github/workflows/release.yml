name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (leave empty to auto-detect from conventional commits)'
        required: false
        default: ''
        type: choice
        options: ['', 'patch', 'minor', 'major']

permissions:
  contents: write   # commit version bump, create tags, create GitHub Release
  packages: write   # push versioned images and Helm chart to GHCR

jobs:
  # ── Gate: only run from main ────────────────────────────────────────────────
  # Workflow_dispatch can be triggered from any branch; this enforces main-only.

  # ── Checks (same gates as CI) ───────────────────────────────────────────────
  check-web:
    name: Web — Format · Lint · Types
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slipstream/web format:check
      - run: pnpm --filter @slipstream/web lint
      - run: pnpm --filter @slipstream/web check

  check-rust:
    name: Rust — Format · Clippy · Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent -> target
      - run: cargo fmt --check
        working-directory: apps/agent
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/agent
      - run: cargo test
        working-directory: apps/agent

  check-go:
    name: Go — Format · Vet · Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: apps/metrics-sidecar/go.mod
      - name: Check formatting
        working-directory: apps/metrics-sidecar
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
        working-directory: apps/metrics-sidecar
      - run: go build ./...
        working-directory: apps/metrics-sidecar

  check-helm:
    name: Helm — Lint · Template
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint
        run: helm lint charts/slipstream

      - name: Render with CI values
        run: helm template slipstream charts/slipstream -f charts/slipstream/ci/values.yaml > /dev/null

  # ── Determine next version, update files, commit, push, tag ────────────────
  version-and-tag:
    name: Version & Tag
    runs-on: ubuntu-latest
    needs: [check-web, check-rust, check-go, check-helm]
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag:     ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          # GITHUB_TOKEN is sufficient; commits/tags by the bot won't re-trigger CI
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Find current version from last semver tag ──────────────────────
      - name: Resolve current version
        id: current
        run: |
          tag=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null \
                || echo "v0.0.0")
          echo "tag=$tag"                >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"        >> "$GITHUB_OUTPUT"
          echo "Current version: $tag"

      # ── 2. Analyse commits since last tag using conventional commit rules ──
      #   BREAKING CHANGE or type! → major
      #   feat                     → minor
      #   anything else            → patch
      - name: Detect bump type
        id: detect
        run: |
          LAST="${{ steps.current.outputs.tag }}"
          OVERRIDE="${{ inputs.bump }}"

          if [ -n "$OVERRIDE" ]; then
            echo "type=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Bump overridden to: $OVERRIDE"
            exit 0
          fi

          if [ "$LAST" = "v0.0.0" ]; then
            LOG=$(git log --pretty=format:"%s" HEAD)
          else
            LOG=$(git log --pretty=format:"%s" "${LAST}..HEAD")
          fi

          if [ -z "$LOG" ]; then
            echo "::error::No commits found since $LAST — nothing to release."
            exit 1
          fi

          BUMP="patch"
          while IFS= read -r msg; do
            # Breaking change patterns
            if printf '%s' "$msg" | grep -qE '^[a-z]+(\([^)]+\))?!:' || \
               printf '%s' "$msg" | grep -q 'BREAKING CHANGE:'; then
              BUMP="major"
              break
            fi
            # Feature — upgrade to minor but keep scanning for major
            if printf '%s' "$msg" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            fi
          done <<< "$LOG"

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

          echo "Detected bump: $BUMP"
          echo ""
          echo "Commits since $LAST:"
          echo "$LOG"

      # ── 3. Compute the next version string ───────────────────────────────
      - name: Calculate next version
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
          case "${{ steps.detect.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          V="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "tag=v${V}"    >> "$GITHUB_OUTPUT"
          echo "Next version: v${V}  (bump: ${{ steps.detect.outputs.type }})"

      # ── 4. Write the new version into every component ────────────────────
      - name: Update version files
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          # Root VERSION file — single source of truth
          echo "$VERSION" > VERSION

          # apps/web/package.json
          node -e "
            const fs  = require('fs')
            const pkg = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync('apps/web/package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

          # apps/agent/Cargo.toml — use tomlkit to update [package].version
          # while preserving all comments, whitespace, and key ordering.
          pip install --quiet tomlkit
          python3 - << 'PYEOF'
          import tomlkit, os
          path = 'apps/agent/Cargo.toml'
          ver  = os.environ['VERSION']
          with open(path) as f:
              doc = tomlkit.load(f)
          doc['package']['version'] = ver
          with open(path, 'w') as f:
              f.write(tomlkit.dumps(doc))
          PYEOF

          # apps/metrics-sidecar/version.go
          python3 - << 'PYEOF'
          import os
          ver = os.environ['VERSION']
          content = f'package main\n\n// Version is set at release time by the release workflow.\nconst Version = "{ver}"\n'
          open('apps/metrics-sidecar/version.go', 'w').write(content)
          PYEOF

          # charts/slipstream/Chart.yaml — update both version and appVersion
          python3 - << 'PYEOF'
          import re, os
          ver  = os.environ['VERSION']
          path = 'charts/slipstream/Chart.yaml'
          with open(path) as f:
              content = f.read()
          content = re.sub(r'^version:.*$', f'version: {ver}', content, flags=re.MULTILINE)
          content = re.sub(r'^appVersion:.*$', f'appVersion: "{ver}"', content, flags=re.MULTILINE)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

          echo ""
          echo "VERSION file:         $(cat VERSION)"
          echo "package.json:         $(node -p "require('./apps/web/package.json').version")"
          echo "Cargo.toml:           $(grep '^version' apps/agent/Cargo.toml | head -1)"
          echo "version.go:           $(cat apps/metrics-sidecar/version.go)"
          echo "Chart.yaml:           $(grep '^version:' charts/slipstream/Chart.yaml)"

      # ── 5. Commit, tag, and push ─────────────────────────────────────────
      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TAG:     ${{ steps.next.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION \
                  apps/web/package.json \
                  apps/agent/Cargo.toml \
                  apps/metrics-sidecar/version.go \
                  charts/slipstream/Chart.yaml

          git commit -m "chore: release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"

          # Push commit and tag atomically-ish; fail fast on conflict
          git push origin main
          git push origin "${TAG}"

  # ── Build and push versioned images from the tagged commit ─────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: version-and-tag
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: agent
            dockerfile: docker/agent/Dockerfile
            platforms: linux/amd64
          - name: metrics-sidecar
            dockerfile: docker/metrics-sidecar/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      # Check out the exact tagged commit, not the workflow ref
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}

      - uses: docker/setup-qemu-action@v4.1.0
      - uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipstream-${{ matrix.image.name }}
          # Provide the tag explicitly so metadata-action parses it as a semver ref
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version-and-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-and-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version-and-tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.image.platforms }}
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}

  # ── Package and publish the Helm chart to GHCR OCI ─────────────────────────
  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: version-and-tag
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        env:
          VERSION: ${{ needs.version-and-tag.outputs.version }}
        run: |
          mkdir -p /tmp/charts
          helm package charts/slipstream \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/charts

      - name: Push to GHCR OCI registry
        env:
          VERSION: ${{ needs.version-and-tag.outputs.version }}
        run: |
          helm push /tmp/charts/slipstream-${VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload chart as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: helm-chart
          path: /tmp/charts/slipstream-*.tgz

  # ── Create GitHub Release with auto-generated notes ─────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version-and-tag, build-and-push, publish-chart]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}
          fetch-depth: 0

      - name: Download chart artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: helm-chart
          path: /tmp/charts

      - name: Create release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.version-and-tag.outputs.tag }}
          name: ${{ needs.version-and-tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: /tmp/charts/slipstream-*.tgz
          append_body: true
          body: |

            ---

            ## Helm Chart

            ```bash
            helm install slipstream \
              oci://ghcr.io/${{ github.repository_owner }}/charts/slipstream \
              --version ${{ needs.version-and-tag.outputs.version }} \
              --namespace slipstream-system \
              --create-namespace \
              --set database.url=postgresql://... \
              --set auth.sessionSecret=... \
              --set gateway.name=... \
              --set gateway.namespace=... \
              --set gateway.hostname=...
            ```

            ## Container Images

            ```
            ghcr.io/${{ github.repository_owner }}/slipstream-web:${{ needs.version-and-tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/slipstream-agent:${{ needs.version-and-tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/slipstream-metrics-sidecar:${{ needs.version-and-tag.outputs.version }}
            ```
