name: Checks

on:
  workflow_call:

jobs:
  check-web:
    name: Web — Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @slipstream/web format:check

      - name: Lint
        run: pnpm --filter @slipstream/web lint

      - name: Type check
        run: pnpm --filter @slipstream/web check

  check-rust:
    name: Rust — Format · Clippy · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent -> target

      - name: Check formatting
        working-directory: apps/agent
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/agent
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: apps/agent
        run: cargo test

  check-go:
    name: Go — Format · Vet · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: apps/metrics-sidecar/go.mod
          cache: false

      - name: Check formatting
        working-directory: apps/metrics-sidecar
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: apps/metrics-sidecar
        run: go vet ./...

      - name: Build
        working-directory: apps/metrics-sidecar
        run: go build ./...

  check-helm:
    name: Helm — Lint · Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint
        run: helm lint charts/slipstream

      - name: Render with CI values
        run: helm template slipstream charts/slipstream -f charts/slipstream/ci/values.yaml > /dev/null
