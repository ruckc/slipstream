name: Checks

on:
  workflow_call:

jobs:
  check-web:
    name: Web — Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @slipstream/web format:check

      - name: Lint
        run: pnpm --filter @slipstream/web lint

      - name: Type check
        run: pnpm --filter @slipstream/web check

  audit-web:
    name: Web — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high

  check-rust:
    name: Rust — Format · Clippy · Test (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: agent
            path: apps/agent
          - name: metrics-collector
            path: apps/metrics-collector
          - name: harbor-collector
            path: apps/harbor-collector
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.crate.path }} -> target

      - name: Check formatting
        working-directory: ${{ matrix.crate.path }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: ${{ matrix.crate.path }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: ${{ matrix.crate.path }}
        run: cargo test

  audit-rust:
    name: Rust — cargo audit (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: agent
            path: apps/agent
          - name: metrics-collector
            path: apps/metrics-collector
          - name: harbor-collector
            path: apps/harbor-collector
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        working-directory: ${{ matrix.crate.path }}
        run: cargo audit

  check-go:
    name: Go — Format · Vet · Build (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: project-controller
            path: apps/project-controller
            build_pkg: ./cmd/...
          - name: hubble-collector
            path: apps/hubble-collector
            build_pkg: ./...
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.service.path }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.service.path }}/go.sum

      - name: Check formatting
        working-directory: ${{ matrix.service.path }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: ${{ matrix.service.path }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.service.path }}
        run: go build -o /tmp/go-build-out ${{ matrix.service.build_pkg }}

  audit-go:
    name: Go — govulncheck (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: project-controller
            path: apps/project-controller
          - name: hubble-collector
            path: apps/hubble-collector
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.service.path }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.service.path }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.service.path }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  check-helm:
    name: Helm — Lint · Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.17.0

      - name: Lint
        run: helm lint charts/slipstream

      - name: Render with CI values
        run: helm template slipstream charts/slipstream -f charts/slipstream/ci/values.yaml > /dev/null
