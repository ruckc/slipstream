<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2d4e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="t-outer" x1="10" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="t-inner" x1="6" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="t-center" x1="4" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Slipstream trails — 5 lines, symmetric, fade in from left -->
  <rect x="10" y="20.5" width="18" height="2"   rx="1"    fill="url(#t-outer)"/>
  <rect x="6"  y="26"   width="22" height="2.5" rx="1.25" fill="url(#t-inner)"/>
  <rect x="4"  y="31"   width="24" height="2.5" rx="1.25" fill="url(#t-center)"/>
  <rect x="6"  y="36.5" width="22" height="2.5" rx="1.25" fill="url(#t-inner)"/>
  <rect x="10" y="42"   width="18" height="2"   rx="1"    fill="url(#t-outer)"/>

  <!-- Forward chevron -->
  <path d="M 30 19 L 50 32 L 30 45"
        fill="none"
        stroke="white"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
